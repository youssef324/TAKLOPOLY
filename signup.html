<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد | TAKLOPOLY Gaming Neon</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="shortcut icon" type="image/x-icon" href="hero1 (2).ico">

    <!-- Isolated Neon Authentication Stylesheet -->
    <link rel="stylesheet" href="auth-neon.css">
</head>

<body class="auth-body signup-theme">
    <!-- Ambient Lighting & Futuristic Cyber Grid -->
    <div class="cyber-grid-overlay"></div>
    <div class="ambient-glow glow-top-right"></div>
    <div class="ambient-glow glow-bottom-left"></div>

    <!-- Top Church & TAKLOPOLY Header -->
    <header class="auth-header">
        <div class="brand-meta-right">
            <i class="fas fa-church"></i>
            <span>كنيسة الانبا تكلا هيمانوت</span>
        </div>

        <div class="brand-center-badge">
            <div class="brand-logo-text">
                <img src="hero1.png" alt="TAKLOPOLY" class="brand-logo-img">
                <span>TAKLOPOLY</span>
            </div>
            <div class="brand-subtext">مسابقة صوم الميلاد 2024</div>
        </div>

        <div class="brand-meta-left">
            <i class="fas fa-cross"></i>
            <span>خدمة اعدادي بنين</span>
        </div>
    </header>

    <!-- Main Centered Content -->
    <main class="auth-main-wrapper">
        <div class="auth-card signup-card">
            <!-- Card Visual Header -->
            <div class="card-header-block">
                <div class="card-theme-icon">
                    <i class="fas fa-user-astronaut"></i>
                </div>
                <h1 class="card-title">تسجيل لاعب جديد</h1>
                <p class="card-subtitle">انضم إلى أبطال تاكلوبولي وشارك في مسابقة صوم الميلاد</p>
            </div>

            <!-- Signup Form (Preserves exact IDs for seamless backend compatibility) -->
            <form id="signup-form" class="auth-form">
                
                <!-- Grid Row 1: Name & Family Selection -->
                <div class="form-grid-row">
                    <!-- Name Field -->
                    <div class="input-group">
                        <label for="name" class="input-label">
                            <i class="fas fa-user"></i>
                            <span>الاسم ثلاثي</span>
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="name" 
                                name="name"
                                class="auth-input" 
                                placeholder="اكتب اسمك هنا" 
                                required 
                                autocomplete="name"
                            >
                            <i class="fas fa-id-card input-icon-prefix"></i>
                        </div>
                    </div>

                    <!-- Family Selection Dropdown -->
                    <div class="input-group">
                        <label for="family" class="input-label">
                            <i class="fas fa-users"></i>
                            <span>الأسرة التابع لها</span>
                        </label>
                        <div class="input-wrapper">
                            <select id="family" name="family" class="auth-select" required>
                                <option value="" disabled selected>-- اختر الأسرة --</option>
                                <option value="اسرة الانبا موسي الاسود">اسرة الانبا موسي الاسود</option>
                                <option value="اسرة مارجرس">اسرة مارجرس</option>
                                <option value="اسرة الانبا كاراس">اسرة الانبا كاراس</option>
                            </select>
                            <i class="fas fa-chevron-down select-arrow"></i>
                            <i class="fas fa-shield-alt input-icon-prefix"></i>
                        </div>
                    </div>
                </div>

                <!-- Grid Row 2: Email & Password -->
                <div class="form-grid-row">
                    <!-- Email Field -->
                    <div class="input-group">
                        <label for="signup-email" class="input-label">
                            <i class="fas fa-envelope"></i>
                            <span>البريد الإلكتروني</span>
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="email" 
                                id="signup-email" 
                                name="signup-email"
                                class="auth-input" 
                                placeholder="name@example.com" 
                                required 
                                autocomplete="email"
                            >
                            <i class="fas fa-at input-icon-prefix"></i>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="input-group">
                        <label for="signup-password" class="input-label">
                            <i class="fas fa-lock"></i>
                            <span>كلمة المرور</span>
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="signup-password" 
                                name="signup-password"
                                class="auth-input" 
                                placeholder="••••••••" 
                                required 
                                autocomplete="new-password"
                            >
                            <i class="fas fa-key input-icon-prefix"></i>
                        </div>
                    </div>
                </div>

                <!-- Profile Picture Upload (Optional) -->
                <div class="input-group">
                    <label class="input-label">
                        <i class="fas fa-camera"></i>
                        <span>الصورة الشخصية (اختياري)</span>
                    </label>
                    <label for="signup-avatar-file" class="file-upload-box">
                        <i class="fas fa-cloud-arrow-up file-upload-icon"></i>
                        <span class="file-upload-title">اختر صورة أو اسحبها هنا</span>
                        <span class="file-upload-hint">PNG أو JPG (ستظهر في كارت اللاعب ولوحة الأبطال)</span>
                        <span id="file-name-preview" class="file-selected-name"></span>
                        <input 
                            type="file" 
                            id="signup-avatar-file" 
                            name="signup-avatar-file"
                            accept="image/png, image/jpeg"
                        >
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="signup-submit-btn" class="auth-submit-btn">
                    <span>تأكيد التسجيل وبدء اللعب</span>
                    <i class="fas fa-rocket"></i>
                </button>

                <!-- Feedback / Status Message Container -->
                <div id="message"></div>
            </form>

            <!-- Navigation to Login -->
            <div class="auth-switch-block">
                <span class="auth-switch-text">لديك حساب لاعب مسجل بالفعل؟</span>
                <a href="login.html" class="auth-switch-link">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>تسجيل الدخول</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="auth-footer">
        <div>
            <span>TAKLOPOLY</span> • كنيسة القديس العظيم الأنبا تكلا هيمانوت بالإبراهيمية • <span>خدمة إعدادي بنين</span>
        </div>
    </footer>

    <!-- UI Helper for Avatar Name Preview -->
    <script>
        const fileInput = document.getElementById('signup-avatar-file');
        const fileNamePreview = document.getElementById('file-name-preview');
        if (fileInput && fileNamePreview) {
            fileInput.addEventListener('change', () => {
                if (fileInput.files && fileInput.files[0]) {
                    fileNamePreview.textContent = 'تم اختيار: ' + fileInput.files[0].name;
                    fileNamePreview.style.display = 'block';
                } else {
                    fileNamePreview.textContent = '';
                    fileNamePreview.style.display = 'none';
                }
            });
        }
    </script>
    <!-- Dedicated Authentication Logic -->
    <script src="auth.js"></script>
</body>
</html>
